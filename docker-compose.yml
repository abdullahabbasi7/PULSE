# One command runs the whole PULSE stack on a laptop:  docker compose up --build
# - Frontend: http://localhost:5173
# - API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse          # owner role: runs migrations only
      POSTGRES_PASSWORD: pulse_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # creates the pulse_app role (first start only)
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      # The app connects as pulse_app, which cannot bypass row-level security.
      DATABASE_URL: postgresql+psycopg://pulse_app:pulse_app_dev@db:5432/pulse
      MIGRATION_DATABASE_URL: postgresql+psycopg://pulse:pulse_dev@db:5432/pulse
      JWT_SECRET: ${JWT_SECRET:-pulse-development-secret-change-me-0123456789}
      CORS_ORIGINS: '["http://localhost:5173"]'
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
